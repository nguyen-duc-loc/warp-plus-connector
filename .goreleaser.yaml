version: 2
project_name: warp-plus-connector

builds:
  - id: wpc
    main: ./cmd/wpc
    binary: wpc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }}

archives:
  - ids:
      - wpc
    formats:
      - tar.gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: checksums.txt

snapshot:
  version_template: '{{ .Version }}-dev-{{ .ShortCommit }}'

changelog:
  disable: true

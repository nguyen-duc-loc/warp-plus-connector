name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag from main
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$REF_TYPE" = tag
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]
          git merge-base --is-ancestor HEAD origin/main
          release_state=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[][] | select(.tag_name == \"$RELEASE_TAG\") | .draft")
          test -z "$release_state" || test "$release_state" = true

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    name: Publish validator (${{ matrix.arch }})
    needs: checks
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v0.38.0
          driver: docker
      - name: Build, verify, and publish the image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${REPOSITORY,,}/validator"
          image_id=$(sh scripts/build-validator-image.sh "$TARGET_ARCH")
          sh scripts/smoke-validator-image.sh "$image_id"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          image_tag="$image:$RELEASE_TAG-$TARGET_ARCH"
          docker tag "$image_id" "$image_tag"
          docker push "$image_tag"
          docker image inspect "$image_tag" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | awk -v prefix="$image@" 'index($0, prefix) == 1 {print; exit}' > "validator-$TARGET_ARCH.txt"
          test -s "validator-$TARGET_ARCH.txt"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: validator-${{ matrix.arch }}
          path: validator-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: validator-*
          path: .release
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v0.38.0
          driver: docker
      - name: Create versioned manifest and require public downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${REPOSITORY,,}/validator"
          amd64_ref=$(cat .release/validator-amd64.txt)
          arm64_ref=$(cat .release/validator-arm64.txt)
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker buildx imagetools create -t "$image:$RELEASE_TAG" "$amd64_ref" "$arm64_ref"
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          for ref in "$amd64_ref" "$arm64_ref" "$image:$RELEASE_TAG"; do
            if ! docker --config "$anonymous_config" manifest inspect "$ref" > /dev/null; then
              echo 'The validator package must be public in GHCR package settings before releasing.' >&2
              exit 1
            fi
          done
          printf 'linux/amd64 %s\nlinux/arm64 %s\n' "$amd64_ref" "$arm64_ref" > .release/validator-images.txt
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

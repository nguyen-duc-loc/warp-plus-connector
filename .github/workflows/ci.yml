name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Install check tools
        run: |
          go install github.com/editorconfig-checker/editorconfig-checker/v4/cmd/editorconfig-checker@v4.0.2
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Formatting
        run: sh scripts/check-format.sh
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...
      - name: Lint
        run: golangci-lint run ./...
      - name: Workflow syntax and shell checks
        run: actionlint
      - name: Native binary smoke check
        run: |
          CGO_ENABLED=0 go build -trimpath -o bin/wpc ./cmd/wpc
          ./bin/wpc version
          ./bin/wpc --help
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v0.38.0
          driver: docker
      - name: Build and inspect the native validator
        run: |
          image_id=$(sh scripts/build-validator-image.sh)
          sh scripts/smoke-validator-image.sh "$image_id"

  snapshot:
    name: Release archives (snapshot)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2.18.3
          args: check
      - name: Build archives without publishing
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2.18.3
          args: release --snapshot --clean
      - name: Verify archive checksums
        working-directory: dist
        run: sha256sum --check checksums.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-snapshot-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7
